name: Daily Cloud DevOps Learning

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create 12 meaningful daily commits
        shell: bash
        run: |
          git config user.name "Ajay Kumar"
          git config user.email "255509140+ajay-cloudops@users.noreply.github.com"

          DATE=$(date -u '+%Y-%m-%d')
          DAY=$(date -u '+%j')

          TOPICS=(
            "Linux File Permissions"
            "Linux Processes"
            "Linux Networking"
            "SSH Basics"
            "Git Status"
            "Git Branching"
            "Git Merge"
            "Git Rebase"
            "Docker Images"
            "Docker Containers"
            "Docker Volumes"
            "Docker Networks"
            "AWS IAM"
            "AWS EC2"
            "AWS S3"
            "AWS VPC"
            "AWS Lambda"
            "AWS CloudWatch"
            "AWS CloudFront"
            "AWS Security Groups"
            "CI CD Basics"
            "GitHub Actions"
            "Pipeline Testing"
            "Deployment Automation"
            "Kubernetes Pods"
            "Kubernetes Deployments"
            "Kubernetes Services"
            "Kubernetes ConfigMaps"
            "Kubernetes Secrets"
            "Kubernetes Ingress"
            "Terraform Providers"
            "Terraform Resources"
            "Terraform State"
            "Infrastructure as Code"
            "DNS Basics"
            "HTTP and HTTPS"
            "Load Balancing"
            "Reverse Proxy"
            "Monitoring"
            "Logging"
            "DevOps Security"
            "Secrets Management"
            "Blue Green Deployment"
            "Rolling Deployment"
            "Zero Downtime Deployment"
            "Health Checks"
            "Auto Scaling"
            "Cloud Architecture"
          )

          mkdir -p daily
          FILE="daily/${DATE}.md"

          echo "# Cloud and DevOps Learning - ${DATE}" > "$FILE"
          echo "" >> "$FILE"

          TOTAL=${#TOPICS[@]}
          START=$(( (10#$DAY * 12) % TOTAL ))

          for i in $(seq 0 11); do
            INDEX=$(( (START + i) % TOTAL ))
            TOPIC="${TOPICS[$INDEX]}"
            NUMBER=$((i + 1))

            {
              echo "## Micro Topic ${NUMBER}: ${TOPIC}"
              echo ""
              echo "- Reviewed: ${TOPIC}"
              echo "- Goal: Understand how ${TOPIC} is used in real Cloud and DevOps workflows."
              echo ""
            } >> "$FILE"

            git add "$FILE"
            git commit -m "Cloud DevOps ${DATE} topic ${NUMBER}: ${TOPIC}"
          done

          echo "${DATE} - Completed 12 Cloud and DevOps micro topics" >> activity.log
          git add activity.log
          git commit --amend --no-edit

          git push
