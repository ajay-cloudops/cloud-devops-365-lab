name: Daily Cloud DevOps Learning

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create 2 to 12 random daily commits
        shell: bash
        run: |
          git config user.name "Ajay Kumar"
          git config user.email "255509140+ajay-cloudops@users.noreply.github.com"

          DATE=$(date -u '+%Y-%m-%d')
          DAY=$(date -u '+%j')

          TOPICS=(
            "Linux File Permissions"
            "Linux Processes"
            "Linux Networking"
            "SSH Basics"
            "Git Status"
            "Git Branching"
            "Git Merge"
            "Git Rebase"
            "Docker Images"
            "Docker Containers"
            "Docker Volumes"
            "Docker Networks"
            "AWS IAM"
            "AWS EC2"
            "AWS S3"
            "AWS VPC"
            "AWS Lambda"
            "AWS CloudWatch"
            "AWS CloudFront"
            "AWS Security Groups"
            "CI CD Basics"
            "GitHub Actions"
            "Pipeline Testing"
            "Deployment Automation"
            "Kubernetes Pods"
            "Kubernetes Deployments"
            "Kubernetes Services"
            "Kubernetes ConfigMaps"
            "Kubernetes Secrets"
            "Kubernetes Ingress"
            "Terraform Providers"
            "Terraform Resources"
            "Terraform State"
            "Infrastructure as Code"
            "DNS Basics"
            "HTTP and HTTPS"
            "Load Balancing"
            "Reverse Proxy"
            "Monitoring"
            "Logging"
            "DevOps Security"
            "Secrets Management"
            "Blue Green Deployment"
            "Rolling Deployment"
            "Zero Downtime Deployment"
            "Health Checks"
            "Auto Scaling"
            "Cloud Architecture"
          )

          set -e
          git config user.name "Ajay Kumar"
          git config user.email "255509140+ajay-cloudops@users.noreply.github.com"

          DATE=$(date -u '+%Y-%m-%d')
          DAY=$(date -u '+%j')
          TOTAL=${#TOPICS[@]}

          mkdir -p daily
          FILE="daily/${DATE}.md"

          # Repeated runs on the same day append new topics safely.
          touch "$FILE"
          EXISTING=$(grep -c '^## Micro Topic ' "$FILE" || true)
          COUNT=$((RANDOM % 11 + 2))
          START=$(( (10#$DAY * 12 + EXISTING) % TOTAL ))

          echo "Today's new topic count: $COUNT"
          echo "Existing topics today: $EXISTING"

          for i in $(seq 0 $((COUNT - 1))); do
            INDEX=$(( (START + i) % TOTAL ))
            TOPIC="${TOPICS[$INDEX]}"
            NUMBER=$((EXISTING + i + 1))
            {
              echo "## Micro Topic ${NUMBER}: ${TOPIC}"
              echo ""
              echo "- Reviewed: ${TOPIC}"
              echo "- Goal: Understand how ${TOPIC} is used in real Cloud and DevOps workflows."
              echo ""
            } >> "$FILE"

            git add "$FILE"
            git commit -m "Cloud DevOps ${DATE} topic ${NUMBER}: ${TOPIC}"
          done

          echo "${DATE} - Added ${COUNT} topics (total today: $((EXISTING + COUNT)))" >> activity.log
          git add activity.log
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push
